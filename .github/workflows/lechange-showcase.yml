name: LeChange Showcase

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base SHA (optional — defaults to HEAD~1)"
        required: false
      head_sha:
        description: "Head SHA (optional — defaults to HEAD)"
        required: false

permissions:
  contents: read
  actions: read

env:
  LECHANGE_REPO: "https://github.com/lituus-io/le-change.git"
  LECHANGE_REF: "feat/workflow-failure-tracking"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # JOB 1: Install lechange + detect all change types + build matrix
  # ═══════════════════════════════════════════════════════════════════
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      added: ${{ steps.changes.outputs.added }}
      deleted: ${{ steps.changes.outputs.deleted }}
      modified: ${{ steps.changes.outputs.modified }}
      renamed: ${{ steps.changes.outputs.renamed }}
      total: ${{ steps.changes.outputs.total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/le-change/target
          key: lechange-${{ runner.os }}-${{ hashFiles('/tmp/le-change/Cargo.lock') }}
          restore-keys: lechange-${{ runner.os }}-

      - name: Build & install lechange from source
        run: |
          pip install maturin
          if [ -d /tmp/le-change/.git ]; then
            cd /tmp/le-change && git fetch origin ${{ env.LECHANGE_REF }} && git checkout FETCH_HEAD
          else
            rm -rf /tmp/le-change
            git clone --depth 1 --branch ${{ env.LECHANGE_REF }} ${{ env.LECHANGE_REPO }} /tmp/le-change
          fi
          cd /tmp/le-change
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Verify lechange installation
        run: |
          python -c "
          import lechange
          print(f'lechange {lechange.__version__} installed')
          print(f'Classes: ChangeDetector, Config, ChangedFiles, PatternMatcher, PathUtil')
          print(f'Functions: escape_json, format_json_array, format_matrix, load_yaml_patterns')
          "

      # ── Step A: Detect all change types ──────────────────────────
      - name: "Step A: Detect all change types"
        id: changes
        run: |
          python - <<'PYEOF'
          import json, os, subprocess

          repo = os.environ["GITHUB_WORKSPACE"]

          base = "${{ inputs.base_sha }}" or ""
          head = "${{ inputs.head_sha }}" or ""

          if not base:
              base = subprocess.run(
                  ["git", "rev-parse", "HEAD~1"], cwd=repo,
                  capture_output=True, text=True
              ).stdout.strip()
              if not base:
                  base = subprocess.run(
                      ["git", "rev-list", "--max-parents=0", "HEAD"], cwd=repo,
                      capture_output=True, text=True
                  ).stdout.strip().split("\n")[0]

          if not head:
              head = subprocess.run(
                  ["git", "rev-parse", "HEAD"], cwd=repo,
                  capture_output=True, text=True, check=True
              ).stdout.strip()

          print(f"Base: {base[:12]}")
          print(f"Head: {head[:12]}")

          from lechange import ChangeDetector, Config

          detector = ChangeDetector(repo)
          config = Config(base_sha=base, sha=head)
          result = detector.get_changed_files(config)

          print(f"\n=== Change Summary ===")
          print(f"Total changed: {result.all_changed_files_count}")
          print(f"Added:    {result.added_files_count}")
          print(f"Deleted:  {result.deleted_files_count}")
          print(f"Modified: {result.modified_files_count}")
          print(f"Renamed:  {result.renamed_files_count}")

          if result.added_files_count:
              print(f"\nAdded files:")
              for f in result.added_files:
                  print(f"  + {f}")

          if result.deleted_files_count:
              print(f"\nDeleted files:")
              for f in result.deleted_files:
                  print(f"  - {f}")

          if result.modified_files_count:
              print(f"\nModified files:")
              for f in result.modified_files:
                  print(f"  M {f}")

          if result.renamed_files_count:
              print(f"\nRenamed files:")
              for old, new in result.renamed_files_mapping.items():
                  print(f"  R {old} -> {new}")

          gh = os.environ["GITHUB_OUTPUT"]
          with open(gh, "a") as f:
              f.write(f"added={result.added_files_count}\n")
              f.write(f"deleted={result.deleted_files_count}\n")
              f.write(f"modified={result.modified_files_count}\n")
              f.write(f"renamed={result.renamed_files_count}\n")
              f.write(f"total={result.all_changed_files_count}\n")
          PYEOF

      # ── Step B: Build matrix from YAML groups ────────────────────
      - name: "Step B: Build job matrix from YAML groups"
        id: matrix
        run: |
          python - <<'PYEOF'
          import json, os, subprocess, textwrap

          repo = os.environ["GITHUB_WORKSPACE"]
          base = "${{ inputs.base_sha }}" or ""
          head = "${{ inputs.head_sha }}" or ""

          if not base:
              base = subprocess.run(
                  ["git", "rev-parse", "HEAD~1"], cwd=repo,
                  capture_output=True, text=True
              ).stdout.strip()
              if not base:
                  base = subprocess.run(
                      ["git", "rev-list", "--max-parents=0", "HEAD"], cwd=repo,
                      capture_output=True, text=True
                  ).stdout.strip().split("\n")[0]

          if not head:
              head = subprocess.run(
                  ["git", "rev-parse", "HEAD"], cwd=repo,
                  capture_output=True, text=True, check=True
              ).stdout.strip()

          from lechange import ChangeDetector, Config, load_yaml_patterns

          YAML_GROUPS = textwrap.dedent("""\
          frontend:
            - "src/components/**"
            - "src/pages/**"
            - "**/*.tsx"
          backend:
            - "src/api/**"
            - "src/models/**"
            - "src/lib/**"
            - "src/auth/**"
          infra:
            - ".github/**"
            - "config/**"
            - "package.json"
          tests:
            - "tests/**"
          """)

          detector = ChangeDetector(repo)
          config = Config(base_sha=base, sha=head, files_yaml=YAML_GROUPS)
          result = detector.get_changed_files(config)

          groups = load_yaml_patterns(YAML_GROUPS)
          all_changed = list(result.all_changed_files)

          matrix_includes = []
          for grp in groups:
              matched = grp["matcher"].filter(all_changed)
              if matched:
                  matrix_includes.append({
                      "group": grp["name"],
                      "files": " ".join(matched),
                      "count": len(matched),
                  })
                  print(f"Group [{grp['name']}]: {len(matched)} files -> {matched}")
              else:
                  print(f"Group [{grp['name']}]: SKIP (no matching changes)")

          matrix = json.dumps({"include": matrix_includes}) if matrix_includes else '{"include":[]}'
          has_changes = "true" if matrix_includes else "false"

          print(f"\nMatrix JSON: {matrix}")
          print(f"Has changes: {has_changes}")

          gh = os.environ["GITHUB_OUTPUT"]
          with open(gh, "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"has_changes={has_changes}\n")
          PYEOF

  # ═══════════════════════════════════════════════════════════════════
  # JOB 2: Matrix jobs — one per changed group
  # ═══════════════════════════════════════════════════════════════════
  test-group:
    name: "Test [${{ matrix.group }}]"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Run tests for ${{ matrix.group }}"
        run: |
          echo "========================================================"
          echo "  Testing group: ${{ matrix.group }}"
          echo "  Files changed: ${{ matrix.count }}"
          echo "  File list: ${{ matrix.files }}"
          echo "========================================================"

          case "${{ matrix.group }}" in
            frontend)
              echo "Running: npx jest --testPathPattern='components|pages'"
              echo "Checking TSX files for lint errors..."
              for f in ${{ matrix.files }}; do
                echo "  Linting $f ... OK"
              done
              echo "Frontend tests passed!"
              ;;
            backend)
              echo "Running: npx jest --testPathPattern='api|models|lib|auth'"
              for f in ${{ matrix.files }}; do
                echo "  Testing $f ... OK"
              done
              echo "Backend tests passed!"
              ;;
            infra)
              echo "Running: yamllint + actionlint"
              for f in ${{ matrix.files }}; do
                echo "  Validating $f ... OK"
              done
              echo "Infrastructure validation passed!"
              ;;
            tests)
              echo "Running: pytest tests/"
              for f in ${{ matrix.files }}; do
                echo "  Executing $f ... OK"
              done
              echo "Test suite passed!"
              ;;
            *)
              echo "Unknown group: ${{ matrix.group }}"
              exit 1
              ;;
          esac

  # ═══════════════════════════════════════════════════════════════════
  # JOB 3: Conditional rebuild — uses workflow failure tracking
  # ═══════════════════════════════════════════════════════════════════
  smart-rebuild:
    name: "Smart Rebuild (failure tracking)"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/le-change/target
          key: lechange-${{ runner.os }}-${{ hashFiles('/tmp/le-change/Cargo.lock') }}
          restore-keys: lechange-${{ runner.os }}-

      - name: Build & install lechange from source
        run: |
          pip install maturin
          if [ -d /tmp/le-change/.git ]; then
            cd /tmp/le-change && git fetch origin ${{ env.LECHANGE_REF }} && git checkout FETCH_HEAD
          else
            rm -rf /tmp/le-change
            git clone --depth 1 --branch ${{ env.LECHANGE_REF }} ${{ env.LECHANGE_REPO }} /tmp/le-change
          fi
          cd /tmp/le-change
          maturin build --release --out dist
          pip install dist/*.whl

      - name: "Analyze: new changes + previous failures"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json, os, subprocess

          repo = os.environ["GITHUB_WORKSPACE"]

          base = subprocess.run(
              ["git", "rev-parse", "HEAD~1"], cwd=repo,
              capture_output=True, text=True
          ).stdout.strip()
          if not base:
              base = subprocess.run(
                  ["git", "rev-list", "--max-parents=0", "HEAD"], cwd=repo,
                  capture_output=True, text=True
              ).stdout.strip().split("\n")[0]
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"], cwd=repo,
              capture_output=True, text=True, check=True
          ).stdout.strip()

          token = os.environ.get("GITHUB_TOKEN", "")

          from lechange import ChangeDetector, Config

          detector = ChangeDetector(repo)

          config = Config(
              base_sha=base,
              sha=head,
              token=token,
              track_workflow_failures=True,
              track_job_level=True,
              wait_for_active_workflows=False,
              workflow_max_wait_seconds=15,
              skip_successful_files=True,
          )

          result = detector.get_changed_files(config)

          print("=" * 60)
          print("  SMART REBUILD ANALYSIS")
          print("=" * 60)

          rebuild = list(result.files_to_rebuild)
          skip = list(result.files_to_skip)
          reasons = list(result.rebuild_reasons)

          print(f"\n  New changes: {result.all_changed_files_count}")
          for f in result.all_changed_files:
              print(f"    {f}")

          print(f"\n  Files to REBUILD ({len(rebuild)}):")
          for f in rebuild:
              print(f"    ! {f}")

          print(f"\n  Files to SKIP ({len(skip)}):")
          for f in skip:
              print(f"    ~ {f}")

          print(f"\n  Rebuild reasons ({len(reasons)}):")
          for r in reasons:
              print(f"    {r['file']}: {r['kind']}")
              if r.get("failed_run_id"):
                  print(f"      failed_run_id: {r['failed_run_id']}")
              if r.get("failed_job_name"):
                  print(f"      failed_job: {r['failed_job_name']}")

          print(f"\n  Failed jobs: {list(result.failed_jobs)}")
          print(f"  Successful jobs: {list(result.successful_jobs)}")

          rebuild_set = set(rebuild)
          skip_set = set(skip)
          overlap = rebuild_set & skip_set
          if overlap:
              print(f"\n  WARNING: rebuild / skip overlap: {overlap}")
          else:
              print(f"\n  Disjoint invariant: rebuild ^ skip = empty set  OK")

          print(f"\n  Diagnostics:")
          for d in result.diagnostics:
              print(f"    [{d['severity']}] {d['category']}: {d['message']}")

          print(f"\n{'=' * 60}")
          print(f"  DECISION: Rebuild {len(rebuild)} files, skip {len(skip)}")
          print(f"{'=' * 60}")
          PYEOF

  # ═══════════════════════════════════════════════════════════════════
  # JOB 4: Summary report
  # ═══════════════════════════════════════════════════════════════════
  summary:
    name: "Summary"
    needs: [detect-changes, test-group, smart-rebuild]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "==================================================="
          echo "  LeChange Showcase - Final Report"
          echo "==================================================="
          echo ""
          echo "  Change Detection:"
          echo "    Total files changed: ${{ needs.detect-changes.outputs.total }}"
          echo "    Added:    ${{ needs.detect-changes.outputs.added }}"
          echo "    Deleted:  ${{ needs.detect-changes.outputs.deleted }}"
          echo "    Modified: ${{ needs.detect-changes.outputs.modified }}"
          echo "    Renamed:  ${{ needs.detect-changes.outputs.renamed }}"
          echo ""
          echo "  Matrix Jobs: ${{ needs.detect-changes.outputs.has_changes == 'true' && 'executed' || 'skipped (no changes)' }}"
          echo "  Test Groups: ${{ needs.test-group.result }}"
          echo "  Smart Rebuild: ${{ needs.smart-rebuild.result }}"
          echo ""
          echo "  Overall: ${{ needs.test-group.result == 'success' && 'PASSED' || needs.test-group.result }}"
          echo "==================================================="

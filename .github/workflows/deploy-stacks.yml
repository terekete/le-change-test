name: Deploy Stacks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "stacks/**"
      - ".github/workflows/deploy-stacks.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LECHANGE_REPO: "https://github.com/lituus-io/le-change.git"
  LECHANGE_REF: "feat/workflow-failure-tracking"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # JOB 1: Detect which stacks have changed YAML files
  # ═══════════════════════════════════════════════════════════════════
  detect-stacks:
    name: "Detect Changed Stacks"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      stacks_summary: ${{ steps.detect.outputs.stacks_summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/le-change/target
          key: lechange-${{ runner.os }}-${{ hashFiles('/tmp/le-change/Cargo.lock') }}
          restore-keys: lechange-${{ runner.os }}-

      - name: Build & install lechange
        run: |
          pip install maturin
          if [ -d /tmp/le-change/.git ]; then
            cd /tmp/le-change && git fetch origin ${{ env.LECHANGE_REF }} && git checkout FETCH_HEAD
          else
            rm -rf /tmp/le-change
            git clone --depth 1 --branch ${{ env.LECHANGE_REF }} ${{ env.LECHANGE_REPO }} /tmp/le-change
          fi
          cd /tmp/le-change
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Detect changed stacks
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json, os, subprocess

          repo = os.environ["GITHUB_WORKSPACE"]
          token = os.environ.get("GITHUB_TOKEN", "")

          # Resolve SHAs
          base = subprocess.run(
              ["git", "rev-parse", "HEAD~1"], cwd=repo,
              capture_output=True, text=True
          ).stdout.strip()
          if not base:
              base = subprocess.run(
                  ["git", "rev-list", "--max-parents=0", "HEAD"], cwd=repo,
                  capture_output=True, text=True
              ).stdout.strip().split("\n")[0]

          head = subprocess.run(
              ["git", "rev-parse", "HEAD"], cwd=repo,
              capture_output=True, text=True, check=True
          ).stdout.strip()

          print(f"Base: {base[:12]}")
          print(f"Head: {head[:12]}")

          from lechange import ChangeDetector, Config, load_yaml_patterns

          # Define YAML groups: one per stack folder
          STACKS_YAML = """\
          dev:
            - "stacks/dev/**"
          staging:
            - "stacks/staging/**"
          prod:
            - "stacks/prod/**"
          """

          detector = ChangeDetector(repo)

          # Detection with workflow failure tracking
          config = Config(
              base_sha=base,
              sha=head,
              files=["stacks/**"],
              files_yaml=STACKS_YAML,
              token=token,
              track_workflow_failures=True,
              failure_tracking_level="job",
              workflow_lookback_commits=5,
              wait_for_active_workflows=False,
              workflow_max_wait_seconds=15,
              include_failed_files=True,
              skip_successful_files=True,
              workflow_name_filter="Deploy Stacks",
          )
          result = detector.get_changed_files(config)

          # Get changed stacks from YAML group keys
          changed_keys = list(result.changed_keys)
          all_changed = list(result.all_changed_files)
          rebuild_files = set(result.files_to_rebuild)
          skip_files = set(result.files_to_skip)

          # Build rebuild reason lookup
          reasons_map = {}
          for r in result.rebuild_reasons:
              reasons_map[r['file']] = r['kind']

          print(f"\n{'=' * 60}")
          print(f"  STACKS DEPLOYMENT ANALYSIS")
          print(f"{'=' * 60}")
          print(f"\n  All detected files: {all_changed}")
          print(f"  Changed stacks (YAML keys): {changed_keys}")
          print(f"  Files to rebuild: {list(rebuild_files)}")
          print(f"  Files to skip: {list(skip_files)}")

          if result.rebuild_reasons:
              print(f"\n  Rebuild reasons:")
              for r in result.rebuild_reasons:
                  reason = r['kind']
                  if r.get('failed_job_name'):
                      reason += f" (job: {r['failed_job_name']})"
                  print(f"    {r['file']}: {reason}")

          # Build matrix: include stacks with current changes OR previous failures
          groups = load_yaml_patterns(STACKS_YAML)
          matrix_includes = []

          for grp in groups:
              name = grp["name"]
              matcher = grp["matcher"]
              matched = matcher.filter(all_changed)

              if not matched:
                  print(f"\n  Stack [{name}]: SKIP (no changed files)")
                  continue

              # Check if any matched files need rebuilding
              needs_deploy = any(f in rebuild_files for f in matched)
              all_skippable = all(f in skip_files for f in matched)

              if all_skippable:
                  print(f"\n  Stack [{name}]: SKIP (previously successful)")
                  for f in matched:
                      print(f"    ~ {f}")
              else:
                  # Determine deploy reason
                  has_new = any(reasons_map.get(f) == "new_change" for f in matched)
                  has_failure = any(reasons_map.get(f) in ("previous_failure", "both_new_and_failed") for f in matched)
                  if has_new and has_failure:
                      reason_tag = "new change + previous failure"
                  elif has_failure:
                      reason_tag = "previous failure"
                  else:
                      reason_tag = "new change"

                  matrix_includes.append({
                      "stack": name,
                      "files": " ".join(matched),
                      "count": len(matched),
                  })
                  print(f"\n  Stack [{name}]: DEPLOY ({reason_tag})")
                  for f in matched:
                      kind = reasons_map.get(f, "new_change")
                      marker = "!" if "failure" in kind else "+"
                      print(f"    {marker} {f}  [{kind}]")

          # Build matrix JSON
          matrix = json.dumps({"include": matrix_includes}) if matrix_includes else '{"include":[]}'
          has_changes = "true" if matrix_includes else "false"

          stacks_list = [e["stack"] for e in matrix_includes]
          summary = ", ".join(stacks_list) if stacks_list else "none"

          print(f"\n  Matrix: {matrix}")
          print(f"  Deploying: {summary}")
          print(f"{'=' * 60}")

          # Diagnostics
          for d in result.diagnostics:
              print(f"  [{d['severity']}] {d['category']}: {d['message']}")

          gh = os.environ["GITHUB_OUTPUT"]
          with open(gh, "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"has_changes={has_changes}\n")
              f.write(f"stacks_summary={summary}\n")
          PYEOF

  # ═══════════════════════════════════════════════════════════════════
  # JOB 2: Deploy each changed stack (matrix job)
  # ═══════════════════════════════════════════════════════════════════
  deploy-stack:
    name: "Deploy [${{ matrix.stack }}]"
    needs: detect-stacks
    if: needs.detect-stacks.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stacks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Validate ${{ matrix.stack }} config"
        run: |
          echo "========================================================"
          echo "  Validating stack: ${{ matrix.stack }}"
          echo "  Changed files (${{ matrix.count }}):"
          for f in ${{ matrix.files }}; do
            echo "    - $f"
          done
          echo "========================================================"

          # Validate YAML syntax
          python3 -c "
          import yaml, sys
          for f in '${{ matrix.files }}'.split():
              try:
                  with open(f) as fh:
                      cfg = yaml.safe_load(fh)
                  print(f'  {f}: valid YAML')
                  print(f'    environment: {cfg.get(\"environment\", \"unknown\")}')
                  print(f'    region: {cfg.get(\"region\", \"unknown\")}')
              except Exception as e:
                  print(f'  {f}: INVALID - {e}')
                  sys.exit(1)
          "

      - name: "Deploy ${{ matrix.stack }}"
        run: |
          echo "========================================================"
          echo "  Deploying stack: ${{ matrix.stack }}"
          echo "========================================================"

          # Hardcoded prod failure for workflow failure tracking test
          if [ "${{ matrix.stack }}" = "prod" ]; then
            echo ""
            echo "  DEPLOY FAILED: prod deployment error (simulated)"
            echo "========================================================"
            exit 1
          fi

          # Simulate deployment steps
          echo "  [1/4] Loading config from stacks/${{ matrix.stack }}/config.yaml..."
          sleep 1

          echo "  [2/4] Planning infrastructure changes..."
          sleep 1

          echo "  [3/4] Applying changes to ${{ matrix.stack }} environment..."
          sleep 1

          echo "  [4/4] Verifying deployment health..."
          sleep 1

          echo ""
          echo "  Stack ${{ matrix.stack }} deployed successfully!"
          echo "========================================================"

  # ═══════════════════════════════════════════════════════════════════
  # JOB 3: Summary
  # ═══════════════════════════════════════════════════════════════════
  summary:
    name: "Deployment Summary"
    needs: [detect-stacks, deploy-stack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "==================================================="
          echo "  Deploy Stacks - Summary"
          echo "==================================================="
          echo ""
          echo "  Stacks deployed: ${{ needs.detect-stacks.outputs.stacks_summary }}"
          echo "  Detection:  ${{ needs.detect-stacks.result }}"
          echo "  Deployment: ${{ needs.deploy-stack.result }}"
          echo ""
          if [ "${{ needs.deploy-stack.result }}" = "success" ]; then
            echo "  Result: ALL STACKS DEPLOYED SUCCESSFULLY"
          elif [ "${{ needs.deploy-stack.result }}" = "skipped" ]; then
            echo "  Result: NO STACKS NEEDED DEPLOYMENT (all skipped)"
          else
            echo "  Result: DEPLOYMENT FAILED - check individual stack logs"
          fi
          echo "==================================================="

vpc:
  cidr: "10.2.0.0/16"
  name: prod-vpc
  enable_dns_hostnames: true
  enable_dns_support: true
  enable_flow_logs: true

subnets:
  public:
    - cidr: "10.2.1.0/24"
      az: us-east-1a
    - cidr: "10.2.2.0/24"
      az: us-east-1b
    - cidr: "10.2.3.0/24"
      az: us-east-1c
  private:
    - cidr: "10.2.10.0/24"
      az: us-east-1a
    - cidr: "10.2.11.0/24"
      az: us-east-1b
    - cidr: "10.2.12.0/24"
      az: us-east-1c

nat_gateway:
  enabled: true
  count: 3

flow_logs:
  enabled: true
  retention_days: 90
  traffic_type: ALL

security_groups:
  app:
    ingress:
      - port: 443
        protocol: tcp
        cidr: "10.0.0.0/8"
    egress:
      - port: 443
        protocol: tcp
        cidr: "0.0.0.0/0"
      - port: 5432
        protocol: tcp
        cidr: "10.2.0.0/16"

waf:
  enabled: true
  rules:
    - rate_limit: 2000
    - geo_block: true
    - sql_injection: true

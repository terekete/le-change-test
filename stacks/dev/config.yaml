environment: dev
region: us-east-1

compute:
  instance_type: t3.large
  min_replicas: 2
  max_replicas: 12
  autoscaling:
    cpu_threshold: 70
    memory_threshold: 80

database:
  engine: postgres
  version: "15.4"
  instance_class: db.t3.medium
  storage_gb: 50
  multi_az: false
  backup_retention_days: 7

networking:
  vpc_cidr: "10.0.0.0/16"
  public_subnets:
    - "10.0.1.0/24"
    - "10.0.2.0/24"
  private_subnets:
    - "10.0.10.0/24"
    - "10.0.11.0/24"

feature_flags:
  canary: true

monitoring:
  log_level: debug
  metrics_interval: 15
  alerts_enabled: true

vpc:
  cidr: "10.1.0.0/16"
  name: staging-vpc
  enable_dns_hostnames: true
  enable_dns_support: true
  enable_flow_logs: true

subnets:
  public:
    - cidr: "10.1.1.0/24"
      az: us-east-1a
    - cidr: "10.1.2.0/24"
      az: us-east-1b
  private:
    - cidr: "10.1.10.0/24"
      az: us-east-1a
    - cidr: "10.1.11.0/24"
      az: us-east-1b

nat_gateway:
  enabled: true
  count: 1

flow_logs:
  enabled: true
  retention_days: 14
  traffic_type: ALL

security_groups:
  app:
    ingress:
      - port: 443
        protocol: tcp
        cidr: "10.0.0.0/8"
    egress:
      - port: 0
        protocol: "-1"
        cidr: "0.0.0.0/0"

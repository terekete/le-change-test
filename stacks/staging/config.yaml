environment: staging
region: us-east-1

compute:
  instance_type: t3.large
  min_replicas: 2
  max_replicas: 8
  autoscaling:
    cpu_threshold: 65
    memory_threshold: 75

database:
  engine: postgres
  version: "15.4"
  instance_class: db.r6g.large
  storage_gb: 100
  multi_az: true
  backup_retention_days: 14

networking:
  vpc_cidr: "10.1.0.0/16"
  public_subnets:
    - "10.1.1.0/24"
    - "10.1.2.0/24"
  private_subnets:
    - "10.1.10.0/24"
    - "10.1.11.0/24"

monitoring:
  log_level: info
  metrics_interval: 30
  alerts_enabled: true
